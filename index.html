<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Planimetria – Arreda casa</title>
<meta name="theme-color" content="#0284c7">
<meta name="description" content="Planimetria: disegna muri, porte e finestre, arreda casa con blocchi parametrici, importa DXF/PDF in scala ed esporta PDF e DXF.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planimetria">

<style>
:root{--bg:#f7f7f5;--panel:#ffffff;--line:#dbe7f0;--ink:#1f2328;--mute:#64748b;--acc:#0284c7;--accbg:#e0f2fe;--sky:#f0f9ff;--ico:#0369a1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#app{display:grid;grid-template-columns:230px 1fr 250px;grid-template-rows:80px 66px 1fr 30px;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header b{margin-right:8px;font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--ico)}
button:hover{background:var(--sky);border-color:#bae6fd}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
aside{background:var(--panel);overflow:auto;padding:10px}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
h4{margin:12px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
h4:first-child{margin-top:0}
#tb{grid-column:1/4;display:flex;align-items:stretch;gap:4px;padding:5px 10px;background:var(--sky);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tgrp{display:flex;gap:4px;align-items:stretch}
.tgl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc;text-align:center;padding:0 2px}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;padding:4px 6px;background:var(--panel);border:1px solid #cfe8f7;border-radius:9px;color:var(--ico);font-size:11px;font-weight:600;line-height:1}
.tbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn:hover{background:var(--accbg)}
.tbtn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tbtn .car{font-size:8px;opacity:.7}
.vsep{width:1px;background:#bae6fd;margin:4px 6px}
#pop{position:fixed;z-index:9;background:var(--panel);border:1px solid #bae6fd;border-radius:10px;box-shadow:0 10px 30px rgba(2,132,199,.18);padding:8px;display:none;gap:6px}
#pop .blk{width:96px}
#pop .selopt{display:flex;align-items:center;gap:10px;width:240px;text-align:left;padding:9px 10px;font-size:13px}#pop .selopt svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}#pop .selopt span{display:flex;flex-direction:column;gap:3px}#pop .selopt small{font-size:11px;opacity:.75}
.tbtn.dis{opacity:.4}
#kpad{position:absolute;right:8px;bottom:84px;display:none;width:240px;background:var(--panel);border:1px solid #7dd3fc;border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(2,132,199,.25);z-index:6;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#kpad .kpH{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#kpad .kpH b{font-size:12px;color:var(--ico)}#kpad .kpH button{min-height:32px;min-width:44px;padding:0}
#kpad button{min-height:46px;font-size:18px;font-weight:700;border-radius:10px;padding:0}
#kpad .kpF{display:flex;gap:6px;margin-bottom:6px}#kpad .kpf{flex:1;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;padding:4px 8px;min-height:52px}#kpad .kpf small{font-size:10px;font-weight:600;opacity:.7}#kpad .kpf b{font-size:18px}#kpad .kpf.on{background:var(--accbg);border-color:var(--acc)}
#kpad .kpD,#kpad .kpK{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#kpad .kpD{margin-bottom:6px}
#kpad .kok{grid-column:4;grid-row:3 / span 2;font-size:15px}
#kpad.min .kpB{display:none}
@media (max-height:700px){#kpad button{min-height:38px}#kpad .kpf{min-height:44px}}
.setsec h4{margin:14px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:7px 0}.srow>label{flex:1 1 160px}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg button{min-height:34px;min-width:44px}
.srow input[type=number]{width:90px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:right}.srow .un{margin-left:6px;color:var(--mute)}
#dbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;flex-wrap:wrap;justify-content:center;gap:6px;width:max-content;max-width:calc(100% - 16px);z-index:6;background:var(--panel);border:1px solid #7dd3fc;border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(2,132,199,.25)}#dbar button{min-height:44px;padding:0 12px;font-size:14px;font-weight:700;border-radius:10px;white-space:nowrap}
#layout{position:fixed;inset:0;z-index:8;background:var(--bg);display:none;flex-direction:column}
.lyTop{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;color:var(--ico)}
.lyTop label{display:flex;align-items:center;gap:5px;font-size:12px}.lyTop select{padding:5px 6px;border:1px solid var(--line);border-radius:7px}
#lyWarn{color:#d97706;font-size:12px}
.lyBody{flex:1;display:flex;min-height:0}#lySide{width:270px;flex:0 0 270px;border-right:1px solid var(--line);overflow:auto;padding:10px}
.lyCv{flex:1;position:relative;min-width:0}#lyc{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
@media (max-width:800px){#lySide{width:210px;flex-basis:210px}}
.gstep{display:flex;align-items:center;gap:3px;color:var(--ico);font-size:12px}
.gstep input{width:58px;padding:4px 5px;border:1px solid var(--line);border-radius:6px;color:var(--ico)}
.gstep.off{opacity:.45}
#obar{display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;z-index:5}
#lbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accbg);border-bottom:1px solid var(--line);padding:6px 10px;color:var(--ico);font-size:13px}
#lbar b{font-size:12px}#lbar input{width:84px;padding:6px;border:1px solid #7dd3fc;border-radius:8px;font-weight:700;font-size:15px;text-align:right}#lbar input.ang{width:64px}
#lbar .algrp{display:flex;align-items:center;gap:4px;padding-left:6px;border-left:1px solid #bae6fd}#lbar .al{display:flex;align-items:center;gap:4px;padding:4px 8px}#lbar .al svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}#lbar .al.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#lbar .dir{width:36px;height:34px;padding:0;font-size:17px;font-weight:700}#lbar .dir.on{background:var(--acc);color:#fff;border-color:var(--acc)}#lbar .hint{margin:0}
#obar b{color:var(--ico);font-size:12px;margin-right:2px}
#obar .grp{display:flex;align-items:center;gap:4px}
#obar .var{padding:2px;border-radius:9px;background:var(--sky);border:1px solid #cfe8f7}
#obar .var.on{border-color:var(--acc);background:var(--accbg);box-shadow:inset 0 0 0 1px var(--acc)}
#obar .var canvas{display:block}
#obar input{width:58px;padding:5px;border:1px solid var(--line);border-radius:7px;text-align:center;color:var(--ico);font-weight:600}
#obar .pm{width:34px;height:34px;padding:0;font-size:18px;font-weight:600}
#obar .chip{padding:4px 8px;border-radius:14px;font-size:12px}
#obar .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#obar .vs{width:1px;align-self:stretch;background:#e0f2fe}
#search{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.libhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.libhead h4{margin:0}.libhead button{padding:2px 9px;font-size:14px}
#app.noL #left{visibility:hidden}
.cat{font-size:11px;font-weight:600;color:var(--acc);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.row select{flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.blk{border:1px solid #cfe8f7;border-radius:8px;padding:4px;text-align:center;cursor:pointer;background:var(--sky);font-size:11px;color:#0c4a6e;position:relative}
.blk .x{position:absolute;top:2px;right:4px;color:var(--mute);font-size:12px;display:none}.blk:hover .x{display:block}
.blk:hover{border-color:var(--acc)}
.blk.on{background:var(--accbg);border-color:var(--acc)}
.blk canvas{display:block;margin:0 auto 2px}
main{position:relative;background:var(--bg);min-width:0;display:flex;flex-direction:column;min-height:0}
#cvw{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
footer{grid-column:1/4;display:flex;gap:14px;align-items:center;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--mute);font-size:12px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row label{flex:0 0 92px;color:var(--mute)}
.row input[type=number],.row input[type=text]{flex:1;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
.row input[type=range]{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hint{color:var(--mute);font-size:12px;margin:6px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10}
#modal .box{background:var(--panel);border-radius:10px;padding:16px;width:min(520px,92vw);max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal h3{margin:0 0 10px;font-size:15px}
#modal textarea{width:100%;height:220px;font:12px/1.3 ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:6px}
#modal img{max-width:100%;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:11}
@media (max-width:900px){#app{grid-template-columns:170px 1fr 190px}}
header{flex-direction:column;align-items:stretch;justify-content:center;gap:4px;padding:3px 10px;overflow:hidden}
.hrow button small{opacity:.6;font-size:10px;margin-left:3px;font-weight:600}
.hrow{display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-height:34px}
#bLayout{font-weight:600}
#app.noL{grid-template-columns:0 1fr 250px}#app.noR{grid-template-columns:230px 1fr 0}#app.noL.noR{grid-template-columns:0 1fr 0}
#app.noL #left,#app.noR #right{padding:0;overflow:hidden;border:0}
#bProj{display:flex;align-items:center;gap:6px;max-width:220px}
#projName{overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:0 0 9px}
.dot.ok{background:#16a34a}.dot.pending{background:#f59e0b}.dot.err{background:#dc2626}.dot.local{background:#9ca3af}
footer .tb{margin-left:auto;display:flex;gap:5px}
footer button{padding:2px 10px;font-size:12px}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.prow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.prow.cur{border-color:var(--acc);background:var(--accbg)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow small{color:var(--mute);font-weight:400;margin-left:6px}
input,select,textarea{background:var(--panel);color:var(--ink);border-color:var(--line)}
body.dark{--bg:#0b1220;--panel:#0f172a;--line:#1e3a5f;--ink:#e2e8f0;--mute:#94a3b8;--acc:#38bdf8;--accbg:#0c2a43;--sky:#0b1a2c;--ico:#7dd3fc}
body.dark .tbtn{border-color:#1e3a5f}body.dark .tbtn.on{color:#0b1220}body.dark button.pri{color:#0b1220}
body.dark .blk{border-color:#1e3a5f;color:#bae6fd}body.dark #obar .var{border-color:#1e3a5f}body.dark .vsep{background:#1e3a5f}
#lpop{position:fixed;z-index:9;background:var(--panel);border:1px solid #bae6fd;border-radius:12px;box-shadow:0 10px 30px rgba(2,132,199,.18);padding:8px;display:none;flex-direction:column;gap:2px;min-width:250px}
body.dark #lpop,body.dark #pop,body.dark #obar{border-color:#1e3a5f}
.lrow{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:8px}.lrow:hover{background:var(--sky)}
.lrow .nm{flex:1;color:var(--ink)}.lrow .ct{color:var(--mute);font-size:11px;min-width:22px;text-align:right}
.lrow button{width:32px;height:28px;padding:0;display:flex;align-items:center;justify-content:center}
.lrow button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lrow.off .nm{color:var(--mute);text-decoration:line-through}.lrow .sw{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.swatches{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.swatches button{width:24px;height:24px;padding:0;border-radius:6px;border:1px solid #94a3b8}
.swatches button.on{box-shadow:0 0 0 2px var(--acc)}
.swatches input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.expsec{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.expsec h4{margin:0 0 6px}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="hrow">
  <button id="bProj" title="Progetti"><span id="sync" class="dot local"></span><span id="projName">Progetto 1</span> ▾</button>
  <button id="bLayout" title="Impaginazione: foglio, scala, nord, cartiglio, PDF">▤ Layout</button>
  <button id="bNew">Nuovo</button>
  <span class="sep"></span>
  <button id="bImport">⇧ Importa</button>
  <button id="bExp">⇩ Esporta</button>
  <span class="sep"></span>
  <button id="bUndo" title="Ctrl+Z">Annulla</button>
  <button id="bRedo" title="Ctrl+Y">Ripeti</button>
  <span style="flex:1"></span>
  <button id="bTheme" title="Modalità chiara / scura">☾</button>
  <button id="bR" title="Mostra/nascondi proprietà">◨</button>
  <button id="bSet" title="Impostazioni">⚙</button>
 </div>
 <div class="hrow">
  <button id="bFit">Adatta vista</button>
  <span class="sep"></span>
  <button id="bSnap" class="on" title="Aggancio ai punti, centri e muri (F3)">Snap <small>F3</small></button>
  <button id="bOrtho" title="Orto: muri sempre a squadra, orizzontali o verticali (F8). Tieni premuto Maiusc per invertire">⊾ Orto <small>F8</small></button>
  <button id="bQuote" class="on">Quote muri</button>
  <span class="sep"></span>
  <button id="bGrid" title="Aggancia muri e punti alla griglia">▦ Griglia</button>
  <span class="gstep"><input id="gStep" type="number" min="1" max="500" step="1" list="glist" title="Passo griglia"> <span id="gUnit">cm</span></span>
  <datalist id="glist"><option value="1"><option value="5"><option value="10"><option value="20"><option value="25"><option value="50"><option value="100"></datalist>
  <span class="sep"></span>
  <button id="bMag" class="on" title="Gli arredi si appoggiano ai muri, anche inclinati (Alt per disattivare al volo)">Arredi al muro</button>
 </div>
</header>
<nav id="tb"></nav>
<aside id="left">
  <div class="libhead"><h4>Arredi</h4><button id="libClose" title="Chiudi la tendina arredi">«</button></div>
  <input id="search" placeholder="Cerca (letto, tavolo, doccia…)">
  <div id="lib"></div>
</aside>
<main><div id="obar"></div><div id="lbar"></div><div id="cvw"><canvas id="cv"></canvas><div id="dbar"><button class="pri" id="dOk">✓ Fine</button><button id="dClose" title="Chiudi la forma sul primo punto">⟲ Chiudi</button><button id="dBack">↶ Indietro</button><button id="dCancel">✕ Annulla</button></div>
<div id="kpad"><div class="kpH"><b>Misura</b><button id="kpMin" title="Riduci / apri">▾</button></div><div class="kpB"><div class="kpF"><button id="kpLen" class="kpf on"><small>Lunghezza</small><b id="kpLenV">—</b></button><button id="kpAng" class="kpf"><small>Angolo</small><b id="kpAngV">auto</b></button></div><div class="kpD"><button data-a="0" title="Destra">→</button><button data-a="90" title="Su">↑</button><button data-a="180" title="Sinistra">←</button><button data-a="270" title="Giù">↓</button></div><div class="kpK"></div></div></div></div></main>
<aside id="right"><div id="props"></div></aside>
<footer><span id="stPos">x 0 · y 0 cm</span><span id="stZoom"></span><span id="stHelp"></span><span class="tb"><button id="fFine">Fine disegno</button><button id="fRot">Ruota</button><button id="fDel">Elimina</button></span></footer>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="pop"></div>
<div id="layout"><div class="lyTop"><button id="lyBack">← Torna al disegno</button><span class="sep"></span>
<label>Foglio <select id="lyPaper"><option>A4</option><option>A3</option><option>A2</option><option>A1</option><option>A0</option></select></label>
<label><select id="lyOr"><option value="h">Orizzontale</option><option value="v">Verticale</option></select></label>
<label>Scala <select id="lyScale"><option value="0">Adatta al foglio</option><option value="20">1:20</option><option value="25">1:25</option><option value="50">1:50</option><option value="75">1:75</option><option value="100">1:100</option><option value="200">1:200</option><option value="500">1:500</option></select></label>
<button id="lyCenter">Centra disegno</button><span id="lyWarn"></span><span style="flex:1"></span><button class="pri" id="lyPdf">Scarica PDF</button></div>
<div class="lyBody"><aside id="lySide"></aside><div class="lyCv"><canvas id="lyc"></canvas></div></div></div>
<div id="lpop"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const THEMES={light:{bg:'#f7f7f5',g1:'#ececE8',g2:'#dcdcd6',gA1:'#dcEEF9',gA2:'#a9d8f2',ax:'#c8c8c0',wall:'#2b2f36',part:'#7b8594',ink:'#374151',fill:'#ffffff',txt:'#111827',lab:'#6b7280',room:'2,132,199',roomTxt:'#0369a1',dim:'#b45309',line:'#0f766e',sel:'#0284c7',under:'#64748b',thumb:'#0369a1'},
dark:{bg:'#0f172a',g1:'#162238',g2:'#1f2f48',gA1:'#142c45',gA2:'#1f5078',ax:'#334155',wall:'#e2e8f0',part:'#94a3b8',ink:'#cbd5e1',fill:'#1e293b',txt:'#f1f5f9',lab:'#94a3b8',room:'56,189,248',roomTxt:'#7dd3fc',dim:'#fbbf24',line:'#5eead4',sel:'#38bdf8',under:'#94a3b8',thumb:'#7dd3fc'}};
let TH=THEMES.light,BG=TH.bg;
let S={items:[],under:null,wallTh:15,partTh:10,nid:1,grid:10,gridOn:true,layers:{},furnCol:''};let magOn=true;
let UH={};            // dati pesanti dello sfondo (immagine / primitive DXF)
let view={x:200,y:120,z:.4};
let tool='select',sel=null,msel=[],selMode='single',aim=null,penT=0,draft=null,ghostBlock=null,mouse={x:0,y:0,sx:0,sy:0,snap:null};
let snapOn=true,orthoOn=false,quoteOn=true,spaceDown=false,shiftDown=false,drag=null,calib=null;
/* ---------- impostazioni (salvate sul dispositivo) e unità di misura ---------- */

/* ---------- utilità ---------- */
const fmt=cm=>(cm/100).toFixed(2)+' m';
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const rad=d=>d*Math.PI/180;
const w2s=(x,y)=>[x*view.z+view.x,y*view.z+view.y];
const s2w=(sx,sy)=>[(sx-view.x)/view.z,(sy-view.y)/view.z];
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));const q=[a[0]+t*dx,a[1]+t*dy];return{d:dist(p,q),q,t}}
function inPoly(p,pts){let r=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>p[1])!=(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])r=!r}return r}
function area(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a[0]*b[1]-b[0]*a[1]}return Math.abs(s)/2/10000}

const snap=()=>JSON.stringify({items:S.items,wallTh:S.wallTh,partTh:S.partTh,nid:S.nid,grid:S.grid,gridOn:S.gridOn,layout:S.layout,layers:S.layers,furnCol:S.furnCol,furnLine:S.furnLine,under:S.under});
function commit(){states.length=si+1;states.push(snap());if(states.length>120)states.shift();si=states.length-1;persist()}
function applyData(o){S.items=o.items||[];migrate(S.items);S.partTh=o.partTh||10;S.wallTh=o.wallTh||15;S.nid=o.nid||1;S.grid=o.grid||10;S.gridOn=o.gridOn!==false;S.layout=o.layout||null;S.layers=o.layers||{};S.furnCol=o.furnCol||'';S.furnLine=o.furnLine||'';S.under=o.under||null;ensureUnder();if(typeof gridUI==='function')gridUI()}
function loadSnap(str){const keepL=S.layers;applyData(JSON.parse(str));S.layers=keepL;setSelIds(selIds());draft=null;persist();panel();draw()}
function undo(){if(si>0){si--;loadSnap(states[si])}}
function redo(){if(si<states.length-1){si++;loadSnap(states[si])}}
function persistLocal(){try{localStorage.setItem('planimetria-v2',JSON.stringify({proj:CUR,name:CURNAME,at:Date.now(),data:snap()}))}catch(e){}}
function persist(){persistLocal();scheduleSave()}
function persistUnder(){try{localStorage.setItem('planimetria-under',JSON.stringify(UH))}catch(e){toast('Sfondo troppo grande per il salvataggio automatico')}}
let LOCAL=null;
function restore(){try{const u=localStorage.getItem('planimetria-under');if(u){UH=JSON.parse(u);if(UH.kind==='img'){UH.img=new Image();UH.img.onload=draw;UH.img.src=UH.src}}
let s=localStorage.getItem('planimetria-v2');if(s){LOCAL=JSON.parse(s);CUR=LOCAL.proj||null;CURNAME=LOCAL.name||'Progetto 1';applyData(JSON.parse(LOCAL.data))}
else{s=localStorage.getItem('planimetria-v1');if(s){const o=JSON.parse(s);if(o.under&&UH.kind&&!o.under.lid){o.under.lid=UH.lid='old'}applyData(o);LOCAL={proj:null,at:0,data:snap()}}}}catch(e){}}
function underReady(){const u=S.under;return !!(u&&UH.kind&&(u.asset?UH.asset===u.asset:(u.lid&&UH.lid===u.lid)))}
function ensureUnder(){const u=S.under;if(!u||!u.asset||UH.asset===u.asset)return;const id=u.asset;UH={asset:id,kind:null};const url='/_blob/'+id;
if(u.kind==='img'){const im=new Image();im.onload=()=>{if(UH.asset===id){UH.kind='img';UH.img=im;UH.w=u.w||im.width;UH.h=u.h||im.height;draw();panel()}};im.onerror=()=>toast('Sfondo non disponibile');im.src=url}
else fetch(url).then(r=>r.json()).then(o=>{if(UH.asset===id){UH.kind='dxf';UH.prims=o.prims;UH.pts=o.pts;UH.w=o.w;UH.h=o.h;draw();panel()}}).catch(()=>toast('Sfondo non disponibile'))}

/* ---------- snap ---------- */
function snapPoints(){const P=[];S.items.forEach(i=>{if(!vis(i))return;if(i.pts)i.pts.forEach(p=>P.push(p));else if(i.t==='dim'){P.push(i.a,i.b)}});if(S.under&&S.under.vis&&L('sfondo').v&&underReady()&&UH.pts){const u=S.under;UH.pts.forEach(p=>P.push([u.x+p[0]*u.s,u.y+p[1]*u.s]))}return P}
function snapSegs(){const L=[];S.items.forEach(i=>{if(!vis(i))return;if((i.t==='wall'||i.t==='line')&&i.pts)for(let k=0;k<i.pts.length-1;k++)L.push([i.pts[k],i.pts[k+1]]);else if(i.t==='room')for(let k=0;k<i.pts.length;k++)L.push([i.pts[k],i.pts[(k+1)%i.pts.length]])});return L}
/* Orto (F8): muri a squadra. Maiusc tenuto premuto inverte lo stato (come in AutoCAD) */
const orthoNow=()=>orthoOn!==shiftDown;
function doSnap(wx,wy,last){const z=view.z/(SET.sens||1),tolP=12/z,tolT=9/z,tolM=8/z,tolE=6/z;let p=[wx,wy],info=null,ref=null;
const ortho=!!last&&orthoNow(),ax=ortho?(Math.abs(wx-last[0])>=Math.abs(wy-last[1])?'h':'v'):null;
const A=q=>ax==='h'?q[0]:q[1],Cr=q=>ax==='h'?q[1]:q[0];const mk=a=>ax==='h'?[a,last[1]]:[last[0],a];
/* chiusura della forma: zona ampia sul primo punto (comoda col dito); in Orto solo se è davvero allineato */
if(draft&&draft.pts.length>=3&&draft.t!=='dim'){const f=draft.pts[0];if(Math.hypot(f[0]-wx,f[1]-wy)<22/z&&(!ortho||Math.abs(Cr(f)-Cr(last))<1.5))return{p:[f[0],f[1]],info:'chiusura'}}
const pts=snapPoints().concat(draft&&draft.pts.length>1?draft.pts.slice(0,-1):[]);
if(ortho){
 p=mk(A([wx,wy]));
 if(snapOn){
  /* allineamento: la misura lungo l'asse si aggancia a quella di un vertice vicino (con guida tratteggiata) */
  let best=tolT;for(const q of pts){const d=Math.abs(A(q)-A([wx,wy]));if(d<best){best=d;p=mk(A(q));info=Math.abs(Cr(q)-Cr(last))<tolP?'punto':'allinea';ref=q}}
  if(!info){let bd=tolM;for(const[a,b]of snapSegs()){const dc=Cr(b)-Cr(a);if(Math.abs(dc)<1e-6)continue;const t=(Cr(last)-Cr(a))/dc;if(t<0||t>1)continue;const aa=A(a)+t*(A(b)-A(a)),d=Math.abs(aa-A([wx,wy]));if(d<bd){bd=d;p=mk(aa);info='muro'}}}
 }
 if(!info){const g=S.gridOn?S.grid:1;p=mk(Math.round(A([wx,wy])/g)*g);info=S.gridOn?'griglia':null}
 return{p,info,ref}}
/* libero: zone di aggancio piccole (punti 12 px, centri 8 px, bordo muro 6 px) per non tirare i muri fuori squadro */
if(snapOn){
 let best=tolP;for(const q of pts){const d=Math.hypot(q[0]-wx,q[1]-wy);if(d<best){best=d;p=[q[0],q[1]];info='punto'}}
 if(!info){const segs=snapSegs();best=tolM;for(const[a,b]of segs){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];const d=Math.hypot(m[0]-wx,m[1]-wy);if(d<best){best=d;p=m;info='medio'}}
  if(!info){best=tolE;for(const[a,b]of segs){const r=segDist([wx,wy],a,b);if(r.d<best){best=r.d;p=r.q;info='muro'}}}}
}
if(!info){const g=S.gridOn?S.grid:1,r=v=>Math.round(v/g)*g;p=[r(wx),r(wy)];info=S.gridOn?'griglia':null}
return{p,info,ref}}
function wallSnapForBlock(wx,wy){let best=35,r=null;S.items.forEach(i=>{if(i.t!=='wall'||!vis(i))return;for(let k=0;k<i.pts.length-1;k++){const s=segDist([wx,wy],i.pts[k],i.pts[k+1]);if(s.d<best+i.th/2){best=s.d;r={q:s.q,th:i.th,ang:Math.atan2(i.pts[k+1][1]-i.pts[k][1],i.pts[k+1][0]-i.pts[k][0])*180/Math.PI}}}});return r}
/* arredi appoggiati ai muri (anche inclinati) e negli angoli */
function furnSnap(x,y,w,h,relRot,origRot){let best=null;
S.items.forEach(i=>{if(i.t!=='wall'||!vis(i))return;for(let k=0;k<i.pts.length-1;k++){const a=i.pts[k],b=i.pts[k+1],L=dist(a,b);if(L<1)continue;const ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L,nx=-uy,ny=ux;
 const t=(x-a[0])*ux+(y-a[1])*uy;if(t<-30||t>L+30)continue;const sd=(x-a[0])*nx+(y-a[1])*ny,side=sd>=0?1:-1;const ang=Math.atan2(uy,ux)*180/Math.PI,base=side>0?ang:ang+180;
 const q=origRot==null?((Math.round(relRot/90)%4)+4)%4:((Math.round((origRot-base)/90)%4)+4)%4;const depth=(q%2?w:h)/2,along=(q%2?h:w)/2,want=i.th/2+depth,gap=Math.abs(sd)-want;
 if(gap<45&&gap>-depth&&(!best||Math.abs(gap)<best.g))best={g:Math.abs(gap),x:x+nx*side*(want-Math.abs(sd)),y:y+ny*side*(want-Math.abs(sd)),rot:((base+q*90)%360+360)%360,ux,uy,along,depth,w:i,k}}});
if(!best)return null;
S.items.forEach(i=>{if(i.t!=='wall'||!vis(i))return;for(let k=0;k<i.pts.length-1;k++){if(i===best.w&&k===best.k)continue;const a=i.pts[k],b=i.pts[k+1],L=dist(a,b);if(L<1)continue;const ux=(b[0]-a[0])/L,uy=(b[1]-a[1])/L,nx=-uy,ny=ux;
 if(Math.abs(ux*best.ux+uy*best.uy)>.3)continue;const t=(best.x-a[0])*ux+(best.y-a[1])*uy;if(t<-best.depth-i.th||t>L+best.depth+i.th)continue;
 const d=(best.x-a[0])*nx+(best.y-a[1])*ny,s2=d>=0?1:-1,want=i.th/2+best.along,gap=Math.abs(d)-want;if(gap<25&&gap>-best.along){const m=want-Math.abs(d);const dot=nx*best.ux+ny*best.uy;const mv=m*s2/(dot||1);if(Math.abs(mv)<60){best.x+=best.ux*mv;best.y+=best.uy*mv}}}});
return best}

function drawGrid(W,H){const z=view.z;const x0=-view.x/z,y0=-view.y/z,x1=(W-view.x)/z,y1=(H-view.y)/z;

function kpBuild(){const k=document.querySelector('#kpad .kpK');if(!k)return;k.innerHTML='';
 [['7'],['8'],['9'],['bk','⌫'],['4'],['5'],['6'],['C'],['1'],['2'],['3'],['ok','↵ Aggiungi'],['0'],[',']].forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label||key;if(key==='ok')b.className='pri kok';if(key==='0')b.style.gridColumn='1 / 3';b.onpointerdown=e=>{e.preventDefault();kpKey(key)};k.appendChild(b)});
 document.querySelectorAll('#kpad .kpD button').forEach(b=>b.onpointerdown=e=>{e.preventDefault();kpDir(+b.dataset.a)});
 $('#kpLen').onpointerdown=e=>{e.preventDefault();KP.f='len';kpSync()};
 $('#kpAng').onpointerdown=e=>{e.preventDefault();KP.f='ang';kpSync()};
 $('#kpMin').onpointerdown=e=>{e.preventDefault();KP.min=!KP.min;kpSync();setTimeout(()=>{if(draft)followPoint(draftEnd())},0)}}
function kpDir(a){const el=$('#lbAng');if(!el)return;el.value=String(a);LB.da=true;KP.f='len';draw();followPoint(draftEnd())}
function kpKey(k){const ang=KP.f==='ang',el=$(ang?'#lbAng':'#lbLen');if(!el)return;const fl=ang?'da':'dl';
 if(k==='ok'){if(!LB.dl){toast('Scrivi una lunghezza in '+UN().n);return}lenAdd();return}
 if(k==='C'){LB[fl]=false;el.value='';draw();return}
 if(k==='bk'){if(!LB[fl])return;el.value=el.value.slice(0,-1);if(!el.value)LB[fl]=false;draw();followPoint(draftEnd());return}
 if(k===','){if(ang)return;if(!LB[fl]){el.value='0';LB[fl]=true}if(!/[.,]/.test(el.value))el.value+=',';draw();return}
 if(!LB[fl]){el.value='';LB[fl]=true}
 if(el.value.length<8)el.value+=k;draw();followPoint(draftEnd())}
function kpSync(){const el=$('#kpad');if(!el)return;const on=!!(draft&&draft.pts.length&&LENT.includes(draft.t)&&kpOn());el.style.display=on?'block':'none';if(!on)return;
 el.classList.toggle('min',KP.min);$('#kpMin').textContent=KP.min?'▴':'▾';
 const l=$('#lbLen'),a=$('#lbAng');$('#kpLenV').textContent=(l&&l.value!==''?l.value:'—')+' '+UN().n;
 $('#kpAngV').textContent=a&&a.value!==''?(LB.da?a.value+'°':'auto '+a.value+'°'):'auto';
 $('#kpLen').classList.toggle('on',KP.f==='len');$('#kpAng').classList.toggle('on',KP.f==='ang')}

/* ---------- la vista segue il muro quando esce dallo schermo ---------- */
function safeRect(){const r=cv.getBoundingClientRect(),m=36,o={l:m,t:m,r:r.width-m,b:r.height-m};
 const kp=$('#kpad'),db=$('#dbar');
 if(kp&&kp.style.display!=='none'){const k=kp.getBoundingClientRect();if(k.width)o.r=Math.min(o.r,k.left-r.left-12)}
 if(db&&db.style.display!=='none'){const k=db.getBoundingClientRect();if(k.height)o.b=Math.min(o.b,k.top-r.top-12)}
 return o}
let panA=null;
function followPoint(wp){if(!wp)return;const R=safeRect(),vx=panA?panA.tx:view.x,vy=panA?panA.ty:view.y,sx=wp[0]*view.z+vx,sy=wp[1]*view.z+vy;let dx=0,dy=0;
 if(sx<R.l)dx=R.l-sx;else if(sx>R.r)dx=R.r-sx;if(sy<R.t)dy=R.t-sy;else if(sy>R.b)dy=R.b-sy;
 if(!dx&&!dy)return;if(!panA){panA={tx:view.x,ty:view.y};requestAnimationFrame(panStep)}panA.tx+=dx;panA.ty+=dy}
function panStep(){const a=panA;if(!a)return;view.x+=(a.tx-view.x)*.3;view.y+=(a.ty-view.y)*.3;
 if(Math.abs(a.tx-view.x)<.5&&Math.abs(a.ty-view.y)<.5){view.x=a.tx;view.y=a.ty;panA=null}else requestAnimationFrame(panStep);draw()}
/* col dito o la penna premuti vicino al bordo, la vista scorre */
let edgeRun=false;
function edgePanKick(){if(edgeRun)return;edgeRun=true;requestAnimationFrame(edgeStep)}
function edgeStep(){edgeRun=false;if(!aim)return;const r=cv.getBoundingClientRect(),E=52,V=9,sx=mouse.sx,sy=mouse.sy;let vx=0,vy=0;
 if(sx<E)vx=V*(E-sx)/E;else if(sx>r.width-E)vx=-V*(sx-(r.width-E))/E;
 if(sy<E)vy=V*(E-sy)/E;else if(sy>r.height-E)vy=-V*(sy-(r.height-E))/E;
 if(vx||vy){view.x+=vx;view.y+=vy;remouse();draw();edgeRun=true;requestAnimationFrame(edgeStep)}}

$('#bSet').onclick=openSettings;kpBuild();gridUI();

$('#bImport').onclick=openImport;$('#bFit').onclick=fitAll;$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
/* Snap (F3) e Orto (F8): stato salvato; su tablet l'Orto parte attivo */
function setSnap(v,msg){snapOn=!!v;try{localStorage.setItem('planimetria-snap',snapOn?'1':'0')}catch(e){}$('#bSnap').classList.toggle('on',snapOn);if(msg)toast(snapOn?'Snap attivo':'Snap disattivato');draw()}
function setOrtho(v,msg){orthoOn=!!v;try{localStorage.setItem('planimetria-ortho',orthoOn?'1':'0')}catch(e){}$('#bOrtho').classList.toggle('on',orthoOn);if(msg)toast(orthoOn?'Orto attivo: muri a squadra':'Orto disattivato: muri liberi');draw()}
$('#bSnap').onclick=()=>setSnap(!snapOn,true);
$('#bOrtho').onclick=()=>setOrtho(!orthoOn,true);
addEventListener('keydown',e=>{if(e.key==='F8'){e.preventDefault();setOrtho(!orthoOn,true)}else if(e.key==='F3'){e.preventDefault();setSnap(!snapOn,true)}});
(()=>{let o=null,s=null;try{o=localStorage.getItem('planimetria-ortho');s=localStorage.getItem('planimetria-snap')}catch(e){}
orthoOn=o==null?matchMedia('(pointer:coarse)').matches:o==='1';snapOn=s==null?true:s==='1';
$('#bOrtho').classList.toggle('on',orthoOn);$('#bSnap').classList.toggle('on',snapOn)})();
$('#bQuote').onclick=e=>{quoteOn=!quoteOn;e.target.classList.toggle('on',quoteOn);draw()};
$('#bGrid').onclick=()=>{S.gridOn=!S.gridOn;gridUI();commit();draw();toast(S.gridOn?'Griglia attiva: passo '+uE(S.grid)+' '+UN().n:'Griglia disattivata: disegno libero al centimetro')};
$('#gStep').onchange=e=>{const v=Math.round(uFromE(+e.target.value));if(v>=1&&v<=500){S.grid=v;if(!S.gridOn)S.gridOn=true;commit();panel();draw()}gridUI()};
$('#bMag').onclick=e=>{magOn=!magOn;e.target.classList.toggle('on',magOn)};
$('#bExp').onclick=openExport;$('#bLayout').onclick=openLayout;lyInit();
$('#bTheme').onclick=()=>setTheme(TH===THEMES.dark?'light':'dark');
$('#bNew').onclick=newProjectAsk;
$('#bProj').onclick=openProjects;
$('#libClose').onclick=()=>toggleLib(false);$('#bR').onclick=()=>{$('#app').classList.toggle('noR');resize()};
$('#fFine').onclick=()=>finishDraft();$('#fDel').onclick=delSel;
$('#dOk').onclick=()=>finishDraft();
$('#dClose').onclick=()=>{if(draft&&draft.pts.length>=3)draft.pts.push(draft.pts[0].slice());finishDraft()};
$('#dBack').onclick=()=>{if(draft){draft.pts.pop();if(!draft.pts.length)draft=null;LB.dl=LB.da=false;draw()}};
$('#dCancel').onclick=()=>{draft=null;LB.dl=LB.da=false;draw()};
$('#fRot').onclick=()=>{if(tool==='place'&&ghostBlock){ghostBlock.rot=(ghostBlock.rot+90)%360;updMouseFake();draw()}else rotSel(90)};
if(innerWidth<1000)$('#app').classList.add('noR');
$('#search').oninput=buildLib;
addEventListener('resize',resize);
initTheme();restore();buildTools();try{if(localStorage.getItem('planimetria-lib')==='0')$('#app').classList.add('noL')}catch(e){}spState();buildLib();states=[snap()];si=0;setTool('select');panel();resize();if(S.items.length||S.under)fitAll();setSync('local','Salvato su questo dispositivo');gridUI();initSync();
</script>
<script>
/* App installabile: funziona offline quando è pubblicata su https (es. GitHub Pages) */
if('serviceWorker' in navigator&&location.protocol==='https:'){
/* quando arriva una versione nuova, ricarica da sola (appena non stai disegnando) */
const had=!!navigator.serviceWorker.controller;let rl=false;
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||rl)return;rl=true;const go=()=>{if(typeof draft!=='undefined'&&(draft||drag))setTimeout(go,3000);else location.reload()};go()});
addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{})})}
</script>
